services:
  web:
    build:
      context: ./src/StripedBassFishingTool.Web
      dockerfile: Dockerfile
    container_name: striped-bass-fishing-tool-web
    ports:
      - "5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=stripedbassfishingtool;Username=stripedbassuser;Password=stripedbasspassword
    depends_on:
      - db

  db:
    image: postgres:18
    container_name: striped-bass-fishing-tool-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: stripedbassfishingtool
      POSTGRES_USER: stripedbassuser
      POSTGRES_PASSWORD: stripedbasspassword
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro

  pgadmin:
    image: dpage/pgadmin4
    container_name: striped-bass-fishing-tool-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@stripertool.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data: