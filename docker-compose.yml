services:
  web:
    build:
      context: ./src/StripedBassFishingTool.Web
      dockerfile: Dockerfile
    container_name: striped-bass-fishing-tool-web
    ports:
      - "5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=stripedbassfishingtool;Username=stripedbassuser;Password=stripedbasspassword
      DurableSeed__AppendOnCreate: "true"
      DurableSeed__KnowledgeEntriesPath: /app/db/seed/100_knowledge_entries_seed.sql
      DurableSeed__ReferenceDataPath: /app/db/seed/010_reference_seed.sql
    volumes:
      - ./db/seed:/app/db/seed
    depends_on:
      - db

  db:
    image: postgres:18
    container_name: striped-bass-fishing-tool-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: stripedbassfishingtool
      POSTGRES_USER: stripedbassuser
      POSTGRES_PASSWORD: stripedbasspassword
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro

  adminer:
    image: adminer
    container_name: striped-bass-fishing-tool-adminer
    restart: unless-stopped
    ports:
      - "5050:8080"
    depends_on:
      - db

volumes:
  postgres_data: